name: Add staff user

# Run by hand (Actions -> "Add staff user" -> Run workflow) to let someone sign
# in, or to change their role. Writes to the live (production) or dev branch of
# Neon project stockbook-demo (connection fetched with NEON_API_KEY).
# Staff can also be invited from Settings -> Users once an admin is signed in.

on:
  workflow_dispatch:
    inputs:
      email:
        description: "Email address"
        required: true
        type: string
      site:
        description: "Which site"
        required: true
        type: choice
        options: [live, dev]
        default: live
      role:
        description: "Role"
        required: true
        type: choice
        options: [admin, user]
        default: user

permissions:
  contents: read

jobs:
  add:
    runs-on: ubuntu-latest
    environment: ${{ inputs.site == 'dev' && 'development' || 'production' }}
    env:
      NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
      EMAIL: ${{ inputs.email }}
      ROLE: ${{ inputs.role }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Database connection from Neon (project stockbook-demo)
        run: node .github/scripts/neon-url.mjs stockbook-demo ${{ inputs.site == 'dev' && 'dev' || 'production' }} ${{ inputs.site == 'dev' && '--create' || '' }} --env DATABASE_URL
      - name: Add user
        run: .github/scripts/step.sh "Add staff user" node lib/db/scripts/add-user.mjs
