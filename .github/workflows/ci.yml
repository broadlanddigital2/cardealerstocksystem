name: CI

# Validates every pull request and every push to main:
# install -> typecheck -> unit tests -> Next.js build -> Cloudflare (OpenNext) build.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Public, build-time values. Set them under Settings -> Secrets and variables
  # -> Actions -> Variables. A syntactically valid placeholder Clerk key lets
  # CI build before the real one is configured.
  NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ vars.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY || 'pk_test_ZXhhbXBsZS5jbGVyay5hY2NvdW50cy5kZXYk' }}
  NEXT_PUBLIC_SHOWROOM_HOSTS: ${{ vars.NEXT_PUBLIC_SHOWROOM_HOSTS }}
  NEXT_TELEMETRY_DISABLED: 1

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: ${{ hashFiles('pnpm-lock.yaml') != '' && 'pnpm' || '' }}

      - name: Install dependencies
        run: |
          if [ -f pnpm-lock.yaml ]; then
            pnpm install --frozen-lockfile
          else
            echo "::warning::No pnpm-lock.yaml committed yet — resolving a fresh one (uploaded as an artifact)."
            pnpm install --no-frozen-lockfile
          fi

      - name: Upload generated lockfile
        if: always() && hashFiles('pnpm-lock.yaml') != ''
        uses: actions/upload-artifact@v4
        with:
          name: pnpm-lock
          path: pnpm-lock.yaml
          retention-days: 7

      - name: Typecheck
        run: pnpm run typecheck

      - name: Unit tests
        run: pnpm run test

      - name: Next.js build
        run: pnpm --filter @workspace/web run build

      - name: Cloudflare Workers build (OpenNext)
        run: pnpm --filter @workspace/web run cloudflare:build
