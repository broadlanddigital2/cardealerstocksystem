name: CI

# Validates every pull request and every push to main:
# install -> typecheck -> unit tests -> Next.js build -> Cloudflare (OpenNext) build.

on:
  pull_request:
  push:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  # Public, build-time values (Settings -> Secrets and variables -> Actions ->
  # Variables). Supabase URL/publishable key default to the production project.
  NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
  NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
  NEXT_PUBLIC_SHOWROOM_HOSTS: ${{ vars.NEXT_PUBLIC_SHOWROOM_HOSTS }}
  NEXT_TELEMETRY_DISABLED: 1

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Throwaway Postgres to prove every SQL migration applies cleanly from an
    # empty database (the same thing a new customer's database goes through).
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: ${{ hashFiles('pnpm-lock.yaml') != '' && 'pnpm' || '' }}

      - name: Install dependencies
        # main and develop must install exactly what's locked; feature branches may update
        # the lockfile (the change is committed back below).
        run: |
          if [ "$GITHUB_REF" = "refs/heads/main" ] || [ "$GITHUB_REF" = "refs/heads/develop" ]; then
            pnpm install --frozen-lockfile
          else
            pnpm install --no-frozen-lockfile
          fi

      # Renders the Drizzle schema into versioned SQL migrations (no database
      # needed). If the schema changed without a matching migration, a branch
      # push gets one generated; on main it's an error.
      - name: Generate SQL migrations
        run: .github/scripts/step.sh "Generate SQL migrations" pnpm --filter @workspace/db run generate

      # Commit generated files (lockfile on first run, new migrations) back to
      # feature branches so every later run uses exactly the same inputs.
      - name: Commit generated files
        if: github.event_name == 'push' && github.ref != 'refs/heads/main' && github.ref != 'refs/heads/develop'
        run: |
          if [ -n "$(git status --porcelain pnpm-lock.yaml lib/db/migrations)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add pnpm-lock.yaml lib/db/migrations
            git commit -m "chore: commit generated lockfile / SQL migrations"
            git push
          fi

      - name: Fail if generated files are out of date on main / develop
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop'
        run: git diff --exit-code -- pnpm-lock.yaml lib/db/migrations

      - name: Apply migrations to an empty database
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
        run: .github/scripts/step.sh "Migrations on empty database" pnpm --filter @workspace/db run migrate

      - name: Typecheck
        run: .github/scripts/step.sh Typecheck pnpm run typecheck

      - name: Unit tests
        run: .github/scripts/step.sh "Unit tests" pnpm run test

      - name: Next.js build
        run: .github/scripts/step.sh "Next.js build" pnpm --filter @workspace/web run build

      - name: Cloudflare Workers build (OpenNext)
        run: .github/scripts/step.sh "OpenNext build" pnpm --filter @workspace/web run cloudflare:build
