name: Database migrations

# Deploys of the app itself are done by Cloudflare Workers Builds (connected to
# this repo, like our other sites). This workflow keeps the Supabase database
# schema in step: after CI passes on main it applies any new SQL migrations
# from lib/db/migrations (generated from lib/db/src/schema and reviewed in PRs).
#
# Repository secret (Settings -> Secrets and variables -> Actions):
#   DATABASE_URL   Supabase session pooler URI (port 5432)

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: db-migrations
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  migrate:
    name: Apply database migrations
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment: production
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - name: Check secret
        id: ready
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::notice::DATABASE_URL secret not set — skipping migrations."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.ready.outputs.ok == 'true'
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: pnpm/action-setup@v4
        if: steps.ready.outputs.ok == 'true'
      - uses: actions/setup-node@v4
        if: steps.ready.outputs.ok == 'true'
        with:
          node-version: 24
          cache: pnpm
      - if: steps.ready.outputs.ok == 'true'
        run: pnpm install --frozen-lockfile
      - name: drizzle-kit migrate
        if: steps.ready.outputs.ok == 'true'
        run: .github/scripts/step.sh "Database migrations" pnpm --filter @workspace/db run migrate
