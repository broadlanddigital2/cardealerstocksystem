openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: vehicles
    description: Vehicle stock book operations
  - name: dashboard
    description: Dashboard summary operations
  - name: settings
    description: Dealer settings operations
  - name: invoices
    description: Sales invoice operations
  - name: reports
    description: Report and export data operations
  - name: Storage
    description: Object storage upload and serving endpoints.
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /vehicle-lookup:
    post:
      operationId: lookupVehicle
      tags: [vehicles]
      summary: Look up registration details using Rapid Car Check
      description: Available to all invited staff. Returns form suggestions only; never saves or publishes stock.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VehicleLookupInput"
      responses:
        "200":
          description: Available vehicle information
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VehicleLookup"
        "400":
          description: Invalid registration
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          description: Sign-in required
        "403":
          description: Invited staff only
        "404":
          description: Vehicle not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "429":
          description: Lookup rate or provider allowance exceeded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "502":
          description: Invalid response from provider
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "503":
          description: Lookup not configured or temporarily unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "504":
          description: Provider timed out
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /vehicles:
    get:
      operationId: listVehicles
      tags: [vehicles]
      summary: List vehicles
      description: List all vehicles with optional filters.
      parameters:
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [in_stock, reserved, sold, disposed, returned]
        - name: dateFrom
          in: query
          required: false
          description: Filter by purchase date on or after (YYYY-MM-DD).
          schema:
            type: string
        - name: dateTo
          in: query
          required: false
          description: Filter by purchase date on or before (YYYY-MM-DD).
          schema:
            type: string
        - name: registrationNumber
          in: query
          required: false
          schema:
            type: string
        - name: stockNumber
          in: query
          required: false
          schema:
            type: string
        - name: makeModel
          in: query
          required: false
          description: Search make or model.
          schema:
            type: string
        - name: party
          in: query
          required: false
          description: Search seller or buyer name.
          schema:
            type: string
      responses:
        "200":
          description: List of vehicles
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Vehicle"
    post:
      operationId: createVehicle
      tags: [vehicles]
      summary: Add a purchased vehicle
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VehicleInput"
      responses:
        "201":
          description: Vehicle created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Vehicle"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /vehicles/{id}:
    get:
      operationId: getVehicle
      tags: [vehicles]
      summary: Get a vehicle by id
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Vehicle
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Vehicle"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
    patch:
      operationId: updateVehicle
      tags: [vehicles]
      summary: Update a vehicle
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VehicleUpdate"
      responses:
        "200":
          description: Updated vehicle
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Vehicle"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
    delete:
      operationId: deleteVehicle
      tags: [vehicles]
      summary: Delete a vehicle
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /vehicles/{id}/sale:
    post:
      operationId: recordSale
      tags: [vehicles]
      summary: Record a sale against a vehicle
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SaleInput"
      responses:
        "200":
          description: Vehicle marked as sold
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Vehicle"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /vehicles/{id}/refund-deposit:
    post:
      operationId: refundHoldingDeposit
      tags: [vehicles]
      summary: Refund a holding deposit and return the vehicle to stock
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Deposit refunded; vehicle back in stock
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Vehicle"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /vehicles/{id}/holding-deposit:
    post:
      operationId: recordHoldingDeposit
      tags: [vehicles]
      summary: Record a holding deposit and reserve a vehicle
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HoldingDepositInput"
      responses:
        "200":
          description: Vehicle reserved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Vehicle"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /vehicles/import:
    post:
      operationId: importVehicles
      tags: [vehicles]
      summary: Import opening stock
      description: Bulk-import opening stock vehicles from a parsed CSV.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ImportStockInput"
      responses:
        "200":
          description: Import result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImportResult"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /dashboard/summary:
    get:
      operationId: getDashboardSummary
      tags: [dashboard]
      summary: Dashboard summary figures
      responses:
        "200":
          description: Dashboard summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardSummary"

  /settings:
    get:
      operationId: getSettings
      tags: [settings]
      summary: Get dealer settings
      responses:
        "200":
          description: Dealer settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DealerSettings"
    put:
      operationId: updateSettings
      tags: [settings]
      summary: Update dealer settings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DealerSettingsInput"
      responses:
        "200":
          description: Updated dealer settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DealerSettings"

  /finance-companies:
    get:
      operationId: listFinanceCompanies
      tags: [finance-companies]
      summary: List finance companies
      description: List the dealer's saved finance companies.
      responses:
        "200":
          description: List of finance companies
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/FinanceCompany"
    post:
      operationId: createFinanceCompany
      tags: [finance-companies]
      summary: Add a finance company
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FinanceCompanyInput"
      responses:
        "201":
          description: Finance company created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FinanceCompany"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /finance-companies/{id}:
    patch:
      operationId: updateFinanceCompany
      tags: [finance-companies]
      summary: Update a finance company
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FinanceCompanyUpdate"
      responses:
        "200":
          description: Updated finance company
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FinanceCompany"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
    delete:
      operationId: deleteFinanceCompany
      tags: [finance-companies]
      summary: Delete a finance company
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /users:
    get:
      operationId: listAppUsers
      tags: [users]
      summary: List app users
      description: List invited users and their permission level (admin only).
      responses:
        "200":
          description: List of app users
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AppUser"
    post:
      operationId: createAppUser
      tags: [users]
      summary: Invite a user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AppUserInput"
      responses:
        "201":
          description: User invited
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppUser"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /users/{id}:
    patch:
      operationId: updateAppUser
      tags: [users]
      summary: Change a user's permission level
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AppUserUpdate"
      responses:
        "200":
          description: Updated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppUser"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
    delete:
      operationId: deleteAppUser
      tags: [users]
      summary: Remove a user's access
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /sellers:
    get:
      operationId: listSellers
      tags: [sellers]
      summary: List sellers
      description: List the dealer's saved sellers (suppliers they buy from).
      responses:
        "200":
          description: List of sellers
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Seller"
    post:
      operationId: createSeller
      tags: [sellers]
      summary: Add a seller
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SellerInput"
      responses:
        "201":
          description: Seller created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Seller"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /sellers/{id}:
    patch:
      operationId: updateSeller
      tags: [sellers]
      summary: Update a seller
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SellerUpdate"
      responses:
        "200":
          description: Updated seller
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Seller"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
    delete:
      operationId: deleteSeller
      tags: [sellers]
      summary: Delete a seller
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /cash-expenses:
    get:
      operationId: listCashExpenses
      tags: [cash-expenses]
      summary: List cash expenses
      description: List the dealer's cash expenses (cash paid out).
      responses:
        "200":
          description: List of cash expenses
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CashExpense"
    post:
      operationId: createCashExpense
      tags: [cash-expenses]
      summary: Add a cash expense
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CashExpenseInput"
      responses:
        "201":
          description: Cash expense created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CashExpense"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /cash-expenses/{id}:
    delete:
      operationId: deleteCashExpense
      tags: [cash-expenses]
      summary: Delete a cash expense
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /invoices:
    get:
      operationId: listInvoices
      tags: [invoices]
      summary: List sales invoices
      responses:
        "200":
          description: List of invoices
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Invoice"

  /invoices/next-number:
    get:
      operationId: getNextInvoiceNumber
      tags: [invoices]
      summary: Get the next auto-generated sales invoice number
      responses:
        "200":
          description: Next invoice number
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NextInvoiceNumber"

  /invoices/{id}:
    get:
      operationId: getInvoice
      tags: [invoices]
      summary: Get an invoice by id
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Invoice
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Invoice"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /vehicles/{id}/invoice:
    get:
      operationId: getVehicleInvoice
      tags: [invoices]
      summary: Get the invoice for a vehicle
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Invoice
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Invoice"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
    post:
      operationId: createVehicleInvoice
      tags: [invoices]
      summary: Create a sales invoice for a sold vehicle
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InvoiceInput"
      responses:
        "201":
          description: Invoice created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Invoice"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /reports/stock:
    get:
      operationId: getStockReport
      tags: [reports]
      summary: Stock list at a selected date
      description: Vehicles that were in stock on the selected date.
      parameters:
        - name: date
          in: query
          required: true
          description: The selected date (YYYY-MM-DD).
          schema:
            type: string
      responses:
        "200":
          description: Vehicles in stock at the date
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Vehicle"

  /reports/purchases:
    get:
      operationId: getPurchasesReport
      tags: [reports]
      summary: Purchases up to a date or for a date range
      parameters:
        - name: from
          in: query
          required: false
          description: Start date (YYYY-MM-DD).
          schema:
            type: string
        - name: to
          in: query
          required: false
          description: End date or up-to date (YYYY-MM-DD).
          schema:
            type: string
      responses:
        "200":
          description: Purchases
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Vehicle"

  /reports/sales:
    get:
      operationId: getSalesReport
      tags: [reports]
      summary: Sales up to a date or for a date range
      parameters:
        - name: from
          in: query
          required: false
          description: Start date (YYYY-MM-DD).
          schema:
            type: string
        - name: to
          in: query
          required: false
          description: End date or up-to date (YYYY-MM-DD).
          schema:
            type: string
      responses:
        "200":
          description: Sales
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Vehicle"

  /reports/deposits:
    get:
      operationId: getDepositsReport
      tags: [reports]
      summary: Holding deposits received and refunded for a date range
      parameters:
        - name: from
          in: query
          required: false
          description: Start date (YYYY-MM-DD).
          schema:
            type: string
        - name: to
          in: query
          required: false
          description: End date or up-to date (YYYY-MM-DD).
          schema:
            type: string
      responses:
        "200":
          description: Deposit ledger entries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DepositReportEntry"

  /storage/uploads/request-url:
    post:
      tags: [Storage]
      operationId: requestUploadUrl
      summary: Request a presigned URL for file upload
      description: |
        Returns a presigned GCS URL for direct upload. The client sends JSON
        metadata here, then uploads the file directly to the returned URL.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UploadUrlRequest'
      responses:
        '200':
          description: Presigned upload URL generated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadUrlResponse'
        '400':
          description: Missing or invalid required fields.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '500':
          description: Failed to generate upload URL.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /storage/public-objects/{filePath}:
    get:
      tags: [Storage]
      operationId: getPublicObject
      summary: Serve a public asset from PUBLIC_OBJECT_SEARCH_PATHS
      description: |
        Unconditionally public — no authentication or ACL checks.
        Searches PUBLIC_OBJECT_SEARCH_PATHS for the given file path.
      parameters:
        - name: filePath
          in: path
          required: true
          schema:
            type: string
          description: Relative file path within the public search paths.
      responses:
        '200':
          description: Object content streamed with correct Content-Type.
          content:
            '*/*':
              schema:
                type: string
                format: binary
        '404':
          description: File not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '500':
          description: Failed to serve public object.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /storage/objects/{objectPath}:
    get:
      tags: [Storage]
      operationId: getStorageObject
      summary: Serve an object entity from PRIVATE_OBJECT_DIR
      description: |
        Serves object entities uploaded via presigned URLs. These can optionally
        be protected with authentication or ACL checks based on the use case.
      parameters:
        - name: objectPath
          in: path
          required: true
          schema:
            type: string
          description: Object path within the private object dir (e.g. `uploads/some-uuid`).
      responses:
        '200':
          description: Object content streamed with correct Content-Type.
          content:
            '*/*':
              schema:
                type: string
                format: binary
        '404':
          description: Object not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '500':
          description: Failed to serve object.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

