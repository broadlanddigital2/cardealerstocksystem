        paymentMethod:
          type: ["string", "null"]
        partExchangeAllowance:
          type: ["number", "null"]
        balancePayable:
          type: number
        holdingDeposit:
          type: ["number", "null"]
        extras:
          type: ["array", "null"]
          items:
            $ref: "#/components/schemas/InvoiceExtra"
        extrasOnFinanceInvoice:
          type: boolean
        notes:
          type: ["string", "null"]
        financeCompanyName:
          type: ["string", "null"]
        financeCompanyAddress:
          type: ["string", "null"]
        financeCompanyEmail:
          type: ["string", "null"]
        createdAt:
          type: string

    InvoiceExtra:
      type: object
      required:
        - description
        - amount
      properties:
        description:
          type: string
          minLength: 1
        amount:
          type: number
          minimum: 0
        vat:
          type: number
          minimum: 0
        onFinanceInvoice:
          type: boolean
          description: When true, this extra is billed on the finance/vehicle invoice rather than a separate extras invoice.

    InvoiceInput:
      type: object
      required:
        - invoiceNumber
        - invoiceDate
        - customerName
        - customerAddress
        - salePrice
        - balancePayable
      properties:
        invoiceNumber:
          type: string
          minLength: 1
        invoiceDate:
          type: string
          minLength: 1
        customerName:
          type: string
          minLength: 1
        customerAddress:
          type: string
          minLength: 1
        salePrice:
          type: number
          minimum: 0
        saleVat:
          type: number
          minimum: 0
        paymentMethod:
          type: string
        partExchangeAllowance:
          type: number
          minimum: 0
        balancePayable:
          type: number
        holdingDeposit:
          type: number
          minimum: 0
        extras:
          type: array
          items:
            $ref: "#/components/schemas/InvoiceExtra"
        extrasOnFinanceInvoice:
          type: boolean
        notes:
          type: string
        financeCompanyName:
          type: string
        financeCompanyAddress:
          type: string
        financeCompanyEmail:
          type: string

    UploadUrlRequest:
      type: object
      required: [name, size, contentType]
      properties:
        name:
          type: string
          minLength: 1
          description: Original file name.
        size:
          type: integer
          minimum: 1
          maximum: 10485760
          description: File size in bytes (max 10 MB).
        contentType:
          type: string
          minLength: 1
          description: MIME type of the file (e.g. `image/jpeg`).
    UploadUrlResponse:
      type: object
      required: [uploadURL, objectPath]
      properties:
        uploadURL:
          type: string
          description: URL for the PUT upload (may be a server-proxied endpoint).
        objectPath:
          type: string
          description: Normalized object path (e.g. `/objects/uploads/uuid`). Store this in your database.
        metadata:
          $ref: '#/components/schemas/UploadUrlRequest'

    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error:
          type: string
